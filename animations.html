<!DOCTYPE html>
<html>
<head>
    <title>Box</title>

    <style>
        :root {
            --box-width: 400px;
            --box-height: 200px;
        }

        .container {
            width: 100%;
            height: 500px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: lightgray;
        }

        .box {
            width: var(--box-width);
            height: var(--box-height);

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;
            border: 3px solid black;
            border-radius: 10px;

            
            animation: moveBox 3s ease-in-out infinite alternate;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            text-decoration: none;
            color: white;
            background-color: rgb(132, 0, 255);

            padding: 10px 20px;
            border-radius: 5px;

            transition: 0.3s;
        }

    
        .links a:hover {
            background-color: green;
            transform: scale(1.1);
        }

        
        .links a:active {
            background-color: rgb(255, 72, 106);
            transform: scale(0.9);
        }

    
        .links a:focus {
            outline: 3px solid orange;
        }

        
        .links a:visited {
            color: yellow;
        }

        /* Box animation */
        @keyframes moveBox {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(300px);
            }
        }
    </style>
</head>

<body>

    <div class="container">

    
        <div class="box">

            
            <div class="links">
                <a href="https://www.google.com" target="_blank">Google</a>
                <a href="https://www.youtube.com" target="_blank">YouTube</a>
                <a href="https://github.com" target="_blank">GitHub</a>
            </div>

        </div>

    </div>

</body>
</html>
